<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Nutrete — Productos Naturales, sin gluten">
  <defs>
    <path id="arcSinGluten" d="M 42 128 A 62 62 0 0 1 118 40" fill="none"/>
    <g id="oliveLeaf">
      <path d="M0 0 C 4.2 -6.8 12.4 -8.4 16.8 -3.2 C 12.4 2.6 4.2 4 0 0 Z"/>
    </g>
  </defs>

  <circle cx="100" cy="100" r="100" fill="#95A284"/>

  <!-- anillo fino abierto -->
  <path d="M 100 38 A 62 62 0 1 1 61 148"
        fill="none" stroke="#F2F0E6" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>

  <!-- "SINGLUTEN" curvo -->
  <text font-family="Inter, Helvetica, Arial, sans-serif" font-size="8.2" letter-spacing="1.6"
        fill="#F2F0E6" opacity=".92">
    <textPath href="#arcSinGluten" startOffset="18%">SINGLUTEN</textPath>
  </text>

  <!-- wordmark -->
  <text x="100" y="107" text-anchor="middle"
        font-family="Fraunces, 'Playfair Display', Georgia, serif"
        font-size="30" letter-spacing="1.8" fill="#F7F5EC">NUTRETE</text>

  <text x="100" y="120.5" text-anchor="middle"
        font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="6.6" letter-spacing="2.5" fill="#F2F0E6" opacity=".82">PRODUCTOS NATURALES</text>

  <!-- rama de olivo -->
  <g transform="translate(100 133)" fill="#F2F0E6" opacity=".92">
    <path d="M -14 22 C -6 14 4 6 15 1" fill="none" stroke="#F2F0E6" stroke-width="1.1" stroke-linecap="round"/>
    <g transform="translate(15 1) rotate(-26)"><use href="#oliveLeaf"/></g>
    <g transform="translate(6.5 6.5) rotate(-52)"><use href="#oliveLeaf"/></g>
    <g transform="translate(6.5 6.5) rotate(28)"  ><use href="#oliveLeaf"/></g>
    <g transform="translate(-1.5 13) rotate(-58)" ><use href="#oliveLeaf"/></g>
    <g transform="translate(-1.5 13) rotate(22)"  ><use href="#oliveLeaf"/></g>
    <g transform="translate(-9 19.5) rotate(-64)" ><use href="#oliveLeaf"/></g>
    <g transform="translate(-9 19.5) rotate(16)"  ><use href="#oliveLeaf"/></g>
  </g>
</svg>
